name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Gradle runs on JDK 25; Minecraft 1.21.1 compiles and runs on the Java 21 toolchain.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run in-game tests
        run: ./gradlew build --stacktrace
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: alive-workplace-${{ github.sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-report-${{ github.sha }}
          path: build/**/junit*.xml
          if-no-files-found: ignore

      # Releasing: bump mod_version in gradle.properties (and add a "## <version>" section to
      # CHANGELOG.md). The first green build on main with a new version publishes a GitHub Release.
      - name: Check whether this version is already released
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            awk -v v="$VERSION" '$0 ~ "^## "v {p=1; next} /^## / && p {exit} p' CHANGELOG.md > build/release-notes.md
            rm -f build/libs/*-sources.jar
          fi
      - name: Publish GitHub release
        if: steps.release.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Alive Workplace ${{ steps.release.outputs.version }}
          body_path: build/release-notes.md
          files: build/libs/*.jar
          prerelease: ${{ startsWith(steps.release.outputs.version, '0.') }}
