<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minecraft Build Preview</title>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <canvas id="preview"></canvas>
    <aside class="hud" aria-live="polite">
      <strong id="build-name">Minecraft Build</strong>
      <span id="build-stats">Loading...</span>
    </aside>
    <div class="viewer-actions" aria-label="Preview controls">
      <button id="lighting-toggle" class="icon-button" type="button" aria-pressed="false" title="Switch to night lighting">Night</button>
    </div>
    <div id="loading" class="loading">Loading build...</div>
  </body>
</html>
