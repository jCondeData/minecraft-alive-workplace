pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	// Gradle runs on JDK 25 (what the 26.x Minecraft versions will need); this fetches the JDK 21 that
	// Minecraft 1.21.1 compiles and runs with when the machine doesn't have one.
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'alive-workplace'
