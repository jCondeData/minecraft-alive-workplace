plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Cobblemon + friends will be added here when the optional Cobblemon integration lands.
}

loom {
	splitEnvironmentSourceSets()
}

// Dev-only screenshot harness (see tools/screenshots/README.md). Never packaged in the mod jar.
sourceSets {
	devclient {
		compileClasspath += main.compileClasspath + main.output + client.compileClasspath + client.output
		runtimeClasspath += main.runtimeClasspath + main.output + client.runtimeClasspath + client.output
	}
}

loom {
	mods {
		"aliveworkplace" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
		"aliveworkplace_devclient" {
			sourceSet sourceSets.devclient
		}
	}

	runs {
		// Opens the "shots" world, stages a scene with builders, saves screenshots to
		// run/screenshots/screenshots/ and quits. Needs a display: use xvfb-run on a server.
		screenshots {
			client()
			name "Screenshot Client"
			source sourceSets.devclient
			runDir "run/screenshots"
			programArgs "--quickPlaySingleplayer", "shots", "--width", "960", "--height", "540"
			vmArg "-Daliveworkplace.shots=true"
			// ./gradlew runScreenshots -Pscene=table   (scenes: builders, table)
			vmArg "-Daliveworkplace.scene=${project.findProperty('scene') ?: 'builders'}"
		}
	}
}

fabricApi {
	// Adds a "gametest" source set and a `runGameTest` task that boots a headless
	// server, runs every @GameTest and exits non-zero on failure. CI runs this.
	configureTests {
		createSourceSet = true
		modId = "aliveworkplace_test"
		enableGameTests = true
		enableClientGameTests = false
		eula = true
	}
}

// -PbuilderDebug=true on runGameTest logs builder decisions (see BuilderWork.DEBUG)
tasks.matching { it.name == "runGameTest" }.configureEach {
	if (project.findProperty("builderDebug") == "true") {
		jvmArgs "-Daliveworkplace.debug=true"
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}
