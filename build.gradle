plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
	// No Kotlin code here: Loom only remaps the Kotlin metadata of mods like Cobblemon (which the compat
	// tests run) when this plugin is applied. The stdlib is not added (kotlin.stdlib.default.dependency).
	id 'org.jetbrains.kotlin.jvm' version '2.2.20'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Other mods, only for the compatibility tests (never bundled, never required).
	maven {
		url = "https://api.modrinth.com/maven"
		content { includeGroup "maven.modrinth" }
	}
}

loom {
	splitEnvironmentSourceSets()
}

// Dev-only screenshot harness (see tools/screenshots/README.md). Never packaged in the mod jar.
sourceSets {
	devclient {
		compileClasspath += main.compileClasspath + main.output + client.compileClasspath + client.output
		runtimeClasspath += main.runtimeClasspath + main.output + client.runtimeClasspath + client.output
	}
	// Compatibility tests: in-game tests that run with other popular building mods installed
	// (Chipped, Rechiseled, Supplementaries). `./gradlew runCompatGameTest`; also part of `build`.
	compattest {
		compileClasspath += main.compileClasspath + main.output
		runtimeClasspath += main.runtimeClasspath + main.output
	}
}

loom {
	createRemapConfigurations(sourceSets.compattest)
	createRemapConfigurations(sourceSets.devclient)
}

loom {
	mods {
		"aliveworkplace" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
		"aliveworkplace_devclient" {
			sourceSet sourceSets.devclient
		}
		"aliveworkplace_compat" {
			sourceSet sourceSets.compattest
		}
	}

	runs {
		// Opens the "shots" world, stages a scene with builders, saves screenshots to
		// run/screenshots/screenshots/ and quits. Needs a display: use xvfb-run on a server.
		screenshots {
			client()
			name "Screenshot Client"
			source sourceSets.devclient
			runDir "run/screenshots"
			programArgs "--quickPlaySingleplayer", "shots", "--width", "960", "--height", "540"
			vmArg "-Daliveworkplace.shots=true"
			// ./gradlew runScreenshots -Pscene=table   (scenes: builders, table)
			vmArg "-Daliveworkplace.scene=${project.findProperty('scene') ?: 'builders'}"
			// SCENE=village: make workshops common so every generated village shows one
			vmArg "-Daliveworkplace.workshopWeight=${project.findProperty('workshopWeight') ?: 3}"
			// ... and HOUSE_WEIGHT the other staffed houses (trainer's house, guard house, clinic, post office)
			if (project.findProperty('houseWeight')) {
				vmArg "-Daliveworkplace.houseWeight=${project.findProperty('houseWeight')}"
			}
			vmArg "-Daliveworkplace.debug=${project.findProperty('builderDebug') ?: 'false'}"
		}
		compatGameTest {
			server()
			name "Compat Game Test"
			source sourceSets.compattest
			runDir "build/run/compatGameTest"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get().asFile}/junit-compat.xml"
			ideConfigGenerated false
		}
	}
}

fabricApi {
	// Adds a "gametest" source set and a `runGameTest` task that boots a headless
	// server, runs every @GameTest and exits non-zero on failure. CI runs this.
	configureTests {
		createSourceSet = true
		modId = "aliveworkplace_test"
		enableGameTests = true
		enableClientGameTests = false
		eula = true
	}
}

// -PbuilderDebug=true on runGameTest logs builder decisions (see BuilderWork.DEBUG)
tasks.matching { it.name == "runGameTest" }.configureEach {
	if (project.findProperty("builderDebug") == "true") {
		jvmArgs "-Daliveworkplace.debug=true"
	}
}

ext.compatMods = [
