/** Unpacks the jars nested in the compat mods (META-INF/jars) into build/compat-nested. */
def compatNestedJars(List<String> mods) {
	def out = file("build/compat-nested")
	def resolved = configurations.detachedConfiguration(*mods.collect { dependencies.create(it) })
	resolved.transitive = false
	def jars = []
	// Nested jars can nest jars of their own (Cobblemon → Fabric Language Kotlin → the Kotlin libraries).
	def unpack
	unpack = { File mod ->
		zipTree(mod).matching { include "META-INF/jars/*.jar" }.each { nested ->
			// owo-sentinel only warns that owo-lib is missing, and refuses to load next to it.
			if (nested.name.startsWith("owo-sentinel")) {
				return
			}
			def target = new File(out, nested.name)
			if (!target.exists()) {
				out.mkdirs()
				target.bytes = nested.bytes
			}
			jars << target
			unpack(target)
		}
	}
	resolved.resolve().each { unpack(it) }
	return jars
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Cobblemon is optional: compiled against for compat/cobblemon, never a runtime dependency.
	modCompileOnly "maven.modrinth:cobblemon:kF7CvxTo"          // Cobblemon 1.7.3
	modCompileOnly "maven.modrinth:cobbledollars:cqsHXSXe"      // CobbleDollars 2.0.0 Beta-5.1 (optional too)
	compileOnly "org.jetbrains.kotlin:kotlin-stdlib:2.1.21"

	// Only loaded by runCompatGameTest: the releases in the Cobbleverse pack (Modrinth version ids).
	compatMods.each { modCompattestRuntimeOnly it }
	// Loom drops the libraries these mods bundle inside themselves, so add those back.
	modCompattestRuntimeOnly files(compatNestedJars(compatMods))

	// Screenshots of Cobblemon features (SCENE=tutor): ./gradlew runScreenshots -Pcobblemon=true
	if (project.findProperty("cobblemon") == "true") {
		modDevclientRuntimeOnly "maven.modrinth:cobblemon:kF7CvxTo"
		modDevclientRuntimeOnly "maven.modrinth:cobbledollars:cqsHXSXe"
		modDevclientRuntimeOnly files(compatNestedJars(["maven.modrinth:cobblemon:kF7CvxTo", "maven.modrinth:cobbledollars:cqsHXSXe"]))
	}
	// SCENE=battle: Mega Showdown too (-Pmega=true), for a Master trainer's Mega Evolution.
	if (project.findProperty("mega") == "true") {
		def mega = ["maven.modrinth:SszvX85I:Y6di9Ram", "maven.modrinth:jtmvUHXj:Xlt4eWBe", "maven.modrinth:ccKDOlHs:JB1fLQnc", "maven.modrinth:lhGA9TYQ:Wto0RchG"]
		mega.each { modDevclientRuntimeOnly it }
		modDevclientRuntimeOnly files(compatNestedJars(mega))
	}
}

// The compat test server needs an accepted EULA in its run directory, like runGameTest.
tasks.matching { it.name == "runCompatGameTest" }.configureEach {
	doFirst {
		def dir = file("build/run/compatGameTest")
		dir.mkdirs()
		new File(dir, "eula.txt").text = "eula=true\n"
	}
}
tasks.matching { it.name == "build" }.configureEach {
	dependsOn "runCompatGameTest"
}

// Layer rules (CLAUDE.md, "Layers"). Every package outside platform/fabric/, compat/ and mixin/ is "core": it may use
// Minecraft, the JDK, the libraries Minecraft ships and our own code, but reaches the mod loader only through platform/
// (Platform), other mods only through compat/ (extension points), and keeps version switches (//? guards) in mc/ and
// platform/. This keeps new Minecraft versions, Fabric API changes and other mods' updates to one small place each.
def checkLayers = tasks.register("checkLayers") {
	group = "verification"
	description = "Fails if a feature package uses loader or other-mod code directly, or contains a version switch"
	def root = file("src/main/java/io/github/jcondedata/aliveworkplace")
	def sources = fileTree(root) { include "**/*.java" }
	inputs.files(sources)
	def report = layout.buildDirectory.file("checkLayers.txt")
	outputs.file(report)
	doLast {
		def allowed = ["java.", "javax.", "net.minecraft.", "com.mojang.", "com.google.gson.", "com.google.common.",
			"org.jetbrains.annotations.", "org.slf4j.", "org.joml.", "it.unimi.dsi.fastutil.", "io.github.jcondedata.aliveworkplace."]
		def problems = []
		sources.files.sort().each { f ->
			def rel = root.toPath().relativize(f.toPath()).toString().replace("\\", "/")
			if (rel.startsWith("platform/fabric/") || rel.startsWith("compat/") || rel.startsWith("mixin/")) {
				return
			}
			boolean guardsAllowed = rel.startsWith("mc/") || rel.startsWith("platform/")
			boolean inComment = false
			f.readLines("UTF-8").eachWithIndex { line, i ->
				def t = line.trim()
				def where = "${rel}:${i + 1}"
				if (t.startsWith("//?") || t.startsWith("/*?")) {
					if (!guardsAllowed) {
						problems << "${where}: version switch outside mc/ or platform/ (write an adapter in mc/)"
					}
					return
				}
				if (inComment) {
					if (t.contains("*/")) {
						inComment = false
					}
					return
				}
				if (t.startsWith("/*")) {
					inComment = !t.contains("*/")
					return
				}
				if (t.startsWith("//") || t.startsWith("*")) {
					return
				}
				def code = t.replaceAll(/"(?:[^"\\]|\\.)*"/, '""').replaceAll(/\/\/.*$/, "")
				def imp = (code =~ /^import\s+(?:static\s+)?([\w.]+)/)
				if (imp.find()) {
					def name = imp.group(1)
					if (!allowed.any { name.startsWith(it) }) {
						problems << "${where}: imports ${name} (only Minecraft, the JDK and our own code; other mods go through compat/)"
					}
				}
				if (code.contains("net.fabricmc.")) {
					problems << "${where}: uses Fabric directly (go through platform/Platform)"
				}
				if (code =~ /\.aliveworkplace\.compat\./) {
					problems << "${where}: uses compat/ directly (add an extension point; compat/Compat fills it in)"
				}
				if (code =~ /\.aliveworkplace\.platform\.fabric\./) {
					problems << "${where}: uses platform/fabric/ directly (go through platform/Platform)"
				}
				if (code =~ /\b(get|set|has|remove)Attached\w*\(/) {
					problems << "${where}: Fabric data attachment method (use platform/Attachment)"
				}
			}
		}
		def out = report.get().asFile
		out.parentFile.mkdirs()
		out.text = problems.join("\n") + "\n"
		if (!problems.isEmpty()) {
			throw new GradleException("Layer rule violations (see CLAUDE.md, \"Layers\"):\n" + problems.join("\n"))
		}
	}
}
tasks.named("check") {
	dependsOn checkLayers
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	// Minecraft 1.21.1 is compiled and run (game tests, clients) with Java 21, whatever JDK Gradle runs on.
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}
