plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
	// No Kotlin code here: Loom only remaps the Kotlin metadata of mods like Cobblemon (which the compat
	// tests run) when this plugin is applied. The stdlib is not added (kotlin.stdlib.default.dependency).
	id 'org.jetbrains.kotlin.jvm' version '2.2.20'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Other mods, only for the compatibility tests (never bundled, never required).
	maven {
		url = "https://api.modrinth.com/maven"
		content { includeGroup "maven.modrinth" }
	}
}

loom {
	splitEnvironmentSourceSets()
}

// Dev-only screenshot harness (see tools/screenshots/README.md). Never packaged in the mod jar.
sourceSets {
	devclient {
		compileClasspath += main.compileClasspath + main.output + client.compileClasspath + client.output
		runtimeClasspath += main.runtimeClasspath + main.output + client.runtimeClasspath + client.output
	}
	// Compatibility tests: in-game tests that run with other popular building mods installed
	// (Chipped, Rechiseled, Supplementaries). `./gradlew runCompatGameTest`; also part of `build`.
	compattest {
		compileClasspath += main.compileClasspath + main.output
		runtimeClasspath += main.runtimeClasspath + main.output
	}
}

loom {
	createRemapConfigurations(sourceSets.compattest)
}

loom {
	mods {
		"aliveworkplace" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
		"aliveworkplace_devclient" {
			sourceSet sourceSets.devclient
		}
		"aliveworkplace_compat" {
			sourceSet sourceSets.compattest
		}
	}

	runs {
		// Opens the "shots" world, stages a scene with builders, saves screenshots to
		// run/screenshots/screenshots/ and quits. Needs a display: use xvfb-run on a server.
		screenshots {
			client()
			name "Screenshot Client"
			source sourceSets.devclient
			runDir "run/screenshots"
			programArgs "--quickPlaySingleplayer", "shots", "--width", "960", "--height", "540"
			vmArg "-Daliveworkplace.shots=true"
			// ./gradlew runScreenshots -Pscene=table   (scenes: builders, table)
			vmArg "-Daliveworkplace.scene=${project.findProperty('scene') ?: 'builders'}"
			// SCENE=village: make workshops common so every generated village shows one
			vmArg "-Daliveworkplace.workshopWeight=${project.findProperty('workshopWeight') ?: 3}"
			// ... and HOUSE_WEIGHT the other staffed houses (trainer's house, guard house, clinic, post office)
			if (project.findProperty('houseWeight')) {
				vmArg "-Daliveworkplace.houseWeight=${project.findProperty('houseWeight')}"
			}
			vmArg "-Daliveworkplace.debug=${project.findProperty('builderDebug') ?: 'false'}"
		}
		compatGameTest {
			server()
			name "Compat Game Test"
			source sourceSets.compattest
			runDir "build/run/compatGameTest"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get().asFile}/junit-compat.xml"
			ideConfigGenerated false
		}
	}
}

fabricApi {
	// Adds a "gametest" source set and a `runGameTest` task that boots a headless
	// server, runs every @GameTest and exits non-zero on failure. CI runs this.
	configureTests {
		createSourceSet = true
		modId = "aliveworkplace_test"
		enableGameTests = true
		enableClientGameTests = false
		eula = true
	}
}

// -PbuilderDebug=true on runGameTest logs builder decisions (see BuilderWork.DEBUG)
tasks.matching { it.name == "runGameTest" }.configureEach {
	if (project.findProperty("builderDebug") == "true") {
		jvmArgs "-Daliveworkplace.debug=true"
	}
}

ext.compatMods = [
	"maven.modrinth:chipped:6h2mVZcb",          // Chipped 4.0.2
	"maven.modrinth:resourceful-lib:Hf91FuVF",  // Resourceful Lib 3.0.12
	"maven.modrinth:athena-ctm:JfyYsWKP",       // Athena 4.0.6
	"maven.modrinth:supplementaries:h8FyJ2as",  // Supplementaries 3.9.9
	"maven.modrinth:moonlight:lje3uEuU",        // Moonlight 3.6.8
	"maven.modrinth:rechiseled:Whwd5n82",       // Rechiseled 1.2.4
	"maven.modrinth:supermartijn642s-core-lib:blDCgrqh",   // 1.1.21
	"maven.modrinth:supermartijn642s-config-lib:euSlaAtA", // 1.1.8
	"maven.modrinth:fusion-connected-textures:6fQXv7Yl",   // Fusion 1.2.12
	"maven.modrinth:cobblemon:kF7CvxTo",        // Cobblemon 1.7.3 (bundles Fabric Language Kotlin)
]

/** Unpacks the jars nested in the compat mods (META-INF/jars) into build/compat-nested. */
def compatNestedJars(List<String> mods) {
	def out = file("build/compat-nested")
	def resolved = configurations.detachedConfiguration(*mods.collect { dependencies.create(it) })
	resolved.transitive = false
	def jars = []
	// Nested jars can nest jars of their own (Cobblemon → Fabric Language Kotlin → the Kotlin libraries).
	def unpack
	unpack = { File mod ->
		zipTree(mod).matching { include "META-INF/jars/*.jar" }.each { nested ->
			def target = new File(out, nested.name)
			if (!target.exists()) {
				out.mkdirs()
				target.bytes = nested.bytes
			}
			jars << target
			unpack(target)
		}
	}
	resolved.resolve().each { unpack(it) }
	return jars
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Cobblemon is optional: compiled against for compat/cobblemon, never a runtime dependency.
	modCompileOnly "maven.modrinth:cobblemon:kF7CvxTo"          // Cobblemon 1.7.3
	compileOnly "org.jetbrains.kotlin:kotlin-stdlib:2.1.21"

	// Only loaded by runCompatGameTest: the releases in the Cobbleverse pack (Modrinth version ids).
	compatMods.each { modCompattestRuntimeOnly it }
	// Loom drops the libraries these mods bundle inside themselves, so add those back.
	modCompattestRuntimeOnly files(compatNestedJars(compatMods))
}

// The compat test server needs an accepted EULA in its run directory, like runGameTest.
tasks.matching { it.name == "runCompatGameTest" }.configureEach {
	doFirst {
		def dir = file("build/run/compatGameTest")
		dir.mkdirs()
		new File(dir, "eula.txt").text = "eula=true\n"
	}
}
tasks.matching { it.name == "build" }.configureEach {
	dependsOn "runCompatGameTest"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}
