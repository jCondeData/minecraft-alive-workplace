# Nightly exhaustive tests (minecraft-mod-tester skill).
# Runs on GitHub's machines (free for public repos: ~16 GB RAM, full network), every night and on demand.
# Needs the skill's scripts in tools/modtest/ (see references/automation.md, "Setting up the project").
# Steps whose tool is missing are skipped.
name: nightly-tests

on:
  schedule:
    - cron: "17 3 * * *"        # ~10 PM US Central, before the night runs
    - cron: "41 4 * * 0"        # Sundays: the weekly benchmark (25.1), nothing else
  workflow_dispatch:
    inputs:
      part:
        description: "all: everything; mutation: only the mutants and repeats (ROADMAP 22.7); benchmark: only the weekly 150-worker benchmark (25.1)"
        required: false
        default: all

permissions:
  contents: read
  issues: write

env:
  NODE: "1.21.1"                 # the Stonecutter node to hammer (versions/<NODE>)
  MODID: "aliveworkplace"        # mod id / package fragment for the log audit
  REPEATS: "5"                   # full GameTest suite runs for the flake sweep

jobs:
  tests:
    if: (github.event_name != 'workflow_dispatch' && github.event.schedule != '41 4 * * 0') || github.event.inputs.part == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - run: mkdir -p build/modtest

      - name: Full build (every node, all GameTests, compat tests)
        run: ./gradlew build --continue --stacktrace 2>&1 | tee build/modtest/build.log; exit ${PIPESTATUS[0]}

      - name: Flake sweep (whole GameTest suite, several runs)
        if: always()
        run: |
          for i in $(seq 1 "$REPEATS"); do
            ./gradlew ":$NODE:runGameTest" > "build/modtest/run$i.log" 2>&1 || true
          done
          python3 tools/modtest/results.py build/modtest/run*.log \
            $( [ -f tools/modtest/baseline.json ] && echo --baseline tools/modtest/baseline.json ) \
            | tee build/modtest/results.md

      - name: Translation check
        if: always()
        run: python3 tools/modtest/langcheck.py | tee build/modtest/langcheck.md

      - name: Log audit (test servers)
        if: always()
        run: |
          python3 tools/modtest/logaudit.py versions/*/build/run --mod "$MODID" \
            $( [ -f tools/modtest/allow.txt ] && echo --allow tools/modtest/allow.txt ) | tee build/modtest/logaudit.md

      - name: Real modpack boot
        if: always() && hashFiles('tools/packtest/run.sh') != ''
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64" PATH="$JAVA_HOME_21_X64/bin:$PATH"
          tools/packtest/run.sh 2>&1 | tee build/modtest/packtest.log
          python3 tools/modtest/logaudit.py build/packtest/server --mod "$MODID" \
            $( [ -f tools/modtest/allow.txt ] && echo --allow tools/modtest/allow.txt ) | tee build/modtest/packtest-audit.md

      - name: Performance soak
        if: always() && hashFiles('tools/packtest/run.sh') != ''
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64" PATH="$JAVA_HOME_21_X64/bin:$PATH"
          # 25.1's benchmark load (150 workers, 3 villages) every night too; the Sunday job below repeats it on its own.
          PERF=true VILLAGES=3 PLOTS=25 tools/packtest/run.sh 2>&1 | tee build/modtest/perf.log

      # The screenshot scenes run in their own workflow, every one of them: showcase.yml.

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-tests-${{ github.run_id }}
          path: |
            build/modtest/
            versions/*/build/run/*/logs/latest.log
            build/packtest/server/server.log
          if-no-files-found: ignore

      - name: Open or update the nightly-tests issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Nightly tests failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            for f in build/modtest/results.md build/modtest/logaudit.md build/modtest/packtest-audit.md build/modtest/langcheck.md; do
              [ -f "$f" ] && { echo "---"; head -c 20000 "$f"; echo; }
            done
          } > build/modtest/issue.md
          n=$(gh issue list --label nightly-tests --state open --json number -q '.[0].number')
          gh label create nightly-tests --color B60205 2>/dev/null || true
          if [ -n "$n" ]; then gh issue comment "$n" --body-file build/modtest/issue.md
          else gh issue create --title "Nightly tests failing" --label nightly-tests --body-file build/modtest/issue.md; fi

  # ROADMAP 25.1: the benchmark, weekly (the Sunday schedule) or on demand (part: benchmark): 150 workers over three
  # villages in the real Cobbleverse pack; tick p50/p95, heap after GC and a profile of our code. The numbers go in
  # docs/performance.md (from the run's summary or the benchmark artifact).
  benchmark:
    if: github.event.schedule == '41 4 * * 0' || github.event.inputs.part == 'benchmark'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the jar
        run: ./gradlew ":$NODE:remapJar" --stacktrace
      - name: Benchmark (150 workers, 3 villages)
        run: |
          mkdir -p build/modtest
          export JAVA_HOME="$JAVA_HOME_21_X64" PATH="$JAVA_HOME_21_X64/bin:$PATH"
          PERF=true VILLAGES=3 PLOTS=25 tools/packtest/run.sh 2>&1 | tee build/modtest/benchmark.log; status=${PIPESTATUS[0]}
          { echo "## Benchmark: 150 workers over 3 villages ($(git rev-parse --short HEAD))"; echo '```'
            grep -E "Benchmark:|Average time per tick|Percentiles|Heap after GC|sites working|%" build/modtest/benchmark.log | head -60
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-${{ github.run_id }}
          path: |
            build/modtest/benchmark.log
            build/packtest/server/perf.jfr
          if-no-files-found: ignore

  # ROADMAP 28.2: the compat suite again with Cobblemon 1.8.1 (the full build above runs it with the pack's 1.7.3).
  compat-cobblemon18:
    if: (github.event_name != 'workflow_dispatch' && github.event.schedule != '41 4 * * 0') || github.event.inputs.part == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Compat GameTests with Cobblemon 1.8.1
        run: |
          mkdir -p build/modtest
          ./gradlew ":$NODE:runCompatGameTest" -Pcobblemon18=true --stacktrace 2>&1 | tee build/modtest/compat18.log; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-compat18-${{ github.run_id }}
          path: |
            build/modtest/compat18.log
            versions/*/build/junit-compat.xml
          if-no-files-found: ignore
      - name: Open or update the nightly-tests issue on failure
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          { echo "Compat GameTests with Cobblemon 1.8.1 failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; echo
            grep -a -E "failed|FAILED|Exception" build/modtest/compat18.log | head -c 15000; } > build/modtest/issue18.md
          gh label create nightly-tests --color B60205 2>/dev/null || true
          n=$(gh issue list --label nightly-tests --state open --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body-file build/modtest/issue18.md
          else gh issue create --title "Nightly tests failing" --label nightly-tests --body-file build/modtest/issue18.md; fi

  # ROADMAP 22.7: about 20 mutants in the code changed in the last 24 hours (tools/modtest/mutate.py, the same set split
  # over 5 parallel jobs), and every GameTest added in that time run 10 times (RepeatNewTests). Survivors, flaky tests
  # and unfinished jobs go to the nightly-tests issue; the report is always in the run's summary and the
  # nightly-mutation artifact (the QA lane reads it: docs/agent/sessions.md, "The QA lane").
  mutation-plan:
    if: (github.event_name != 'workflow_dispatch' && github.event.schedule != '41 4 * * 0') || (github.event_name == 'workflow_dispatch' && github.event.inputs.part != 'benchmark')
    runs-on: ubuntu-latest
    outputs:
      since: ${{ steps.plan.outputs.since }}
      tests: ${{ steps.plan.outputs.tests }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: plan
        run: |
          since=$(git rev-list -1 --before="24 hours ago" HEAD)
          if [ -n "$since" ]; then
            tests=$(python3 tools/modtest/newtests.py --since "$since" --csv)
            python3 tools/modtest/mutate.py --since "$since" --max 20 --seed "$(date -u +%j)" --list || true
          fi
          echo "since=$since" >> "$GITHUB_OUTPUT"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          echo "Window starts at ${since:-nothing (no commit that old)}; new tests: ${tests:-none}" >> "$GITHUB_STEP_SUMMARY"

  mutants:
    needs: mutation-plan
    if: needs.mutation-plan.outputs.since != ''
    name: mutants ${{ matrix.shard }}/5
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Mutants (shard ${{ matrix.shard }} of 5)
        env:
          SINCE: ${{ needs.mutation-plan.outputs.since }}
        run: |
          mkdir -p build/nightly
          python3 tools/modtest/mutate.py --since "$SINCE" --max 20 --seed "$(date -u +%j)" --shard "${{ matrix.shard }}/5" \
            --cmd "./gradlew :$NODE:runGameTest" --timeout 1800 > "build/nightly/mutants-${{ matrix.shard }}.md" 2>&1 || true
          cat "build/nightly/mutants-${{ matrix.shard }}.md"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-mutants-${{ matrix.shard }}
          path: build/nightly/
          retention-days: 14

  repeats:
    needs: mutation-plan
    if: needs.mutation-plan.outputs.tests != ''
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Every new GameTest, 10 times
        env:
          ALIVEWORKPLACE_REPEAT: ${{ needs.mutation-plan.outputs.tests }}
        run: |
          mkdir -p build/nightly
          echo "$ALIVEWORKPLACE_REPEAT" | tr ',' '\n' > build/nightly/repeats.txt
          python3 tools/modtest/only_tests.py RepeatNewTests
          ./gradlew ":$NODE:runGameTest" > build/nightly/repeats.log 2>&1 || true
          cp "versions/$NODE/build/junit.xml" build/nightly/repeats.xml || true
          tail -5 build/nightly/repeats.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-repeats
          path: build/nightly/
          retention-days: 14

  mutation-report:
    needs: [mutation-plan, mutants, repeats]
    if: always() && needs.mutation-plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        continue-on-error: true    # nothing changed in the window: no mutants artifacts
        with:
          pattern: nightly-mutants-*
          path: build/nightly
          merge-multiple: true
      - uses: actions/download-artifact@v4
        continue-on-error: true    # no new tests: no repeats artifact
        with:
          name: nightly-repeats
          path: build/nightly
      - name: Report
        id: report
        env:
          SINCE: ${{ needs.mutation-plan.outputs.since }}
        run: |
          mkdir -p build/nightly
          echo "$SINCE" > build/nightly/since.txt
          if python3 tools/modtest/nightly_report.py --dir build/nightly --out build/nightly/report.md
          then echo "bad=no" >> "$GITHUB_OUTPUT"; else echo "bad=yes" >> "$GITHUB_OUTPUT"; fi
          cat build/nightly/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-mutation
          path: build/nightly/report.md
          retention-days: 30
      - name: Survivors and flakes to the nightly-tests issue
        if: steps.report.outputs.bad == 'yes' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          { echo "Nightly mutation and repeats: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; echo
            head -c 20000 build/nightly/report.md; } > build/nightly/issue.md
          gh label create nightly-tests --color B60205 2>/dev/null || true
          n=$(gh issue list --label nightly-tests --state open --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body-file build/nightly/issue.md
          else gh issue create --title "Nightly tests failing" --label nightly-tests --body-file build/nightly/issue.md; fi
