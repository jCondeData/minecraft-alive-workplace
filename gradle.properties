# Gradle options only: the mod's properties and each Minecraft version's dependencies are in stonecutter.properties.toml.
# G1 with a periodic GC hands the daemon's unused heap back to the OS while it idles, e.g. during the compat
# GameTests (B55): a daemon grown to ~2.6 GB plus the compat server didn't fit the 7 GB dev container.
org.gradle.jvmargs=-Xmx2G -XX:+UseG1GC -XX:G1PeriodicGCInterval=10000 -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=30
org.gradle.parallel=true
org.gradle.configuration-cache=false

# The Loom that loom-back-compat applies to every node (fabric-loom-remap up to 1.21.11, fabric-loom from 26.1).
# It must be a Gradle property (here), not in stonecutter.properties.toml.
loomx.loom_version=1.18.2
# The Kotlin plugin (applied on nodes whose compat tests run Cobblemon) must not add kotlin-stdlib to the mod.
kotlin.stdlib.default.dependency=false
