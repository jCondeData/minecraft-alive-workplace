    "maven.modrinth:dlx62Wp3:KQwSroDP",         # Cobblecuisine 2.0.1 (the Chef's dishes, bean farms)
    # Milestone 41 (Waystones), the pack's version
    "maven.modrinth:waystones:Ub2AL65v",        # Waystones 21.1.37 (village waystones, 41.1)
    "maven.modrinth:MBAkmtvl:R6U3hZRZ",         # Balm 21.0.63 (for Waystones)
]
# Local mod jars (files in the repo, not on a maven) the compat suite runs with. They go into the run's mods/ folder,
# where Fabric Loader treats them as in a real install (build.gradle.kts, localModsInto), without their own GameTests.
# Local mod jars the mod compiles against for compat/<mod>/ (modCompileOnly: never a runtime dependency or in the jar).
# The owner's Create port: compat/create/ drives Create's own trains (ROADMAP 39.7a).
tests.compat_compile_files = ["libs/create-fabric-6.0.10.0+mc1.21.1.jar"]
tests.compat_files = [
    "libs/create-fabric-6.0.10.0+mc1.21.1.jar", # Milestone 39 (Create, 2.3): the owner's Fabric port of Create 6.0.10 (libs/README.md)
]
# -Pcobblemon18=true: the compat suite, the screenshot harness and the showcase run with Cobblemon 1.8.1 instead of
# 1.7.3 (the mod still compiles against 1.7.3). "old -> new" swaps a runtime mod; "old -> " leaves it out of that run.
tests.cobblemon18 = [
    "maven.modrinth:cobblemon:kF7CvxTo -> maven.modrinth:cobblemon:gBW3vLC7",          # Cobblemon 1.8.1
    "maven.modrinth:SszvX85I:Y6di9Ram -> maven.modrinth:SszvX85I:TKdAixuR",            # Mega Showdown 1.2.0 for 1.8.1
    "maven.modrinth:cobbleworkers:qW3KB1li -> maven.modrinth:cobbleworkers:llwrszjl",  # Cobbleworkers 2.0.5 for 1.8.0
    "maven.modrinth:GebWh45l:Lecb595b -> maven.modrinth:GebWh45l:aFuImAaR",            # Raid Dens 0.13.2 for 1.8
    # Cobblecuisine has no build for Cobblemon 1.8 (2.0.1 asks for Cobblemon >= 1.7.0), so the 1.8 runs keep it.
]
# The screenshot harness (src/devclient, `runScreenshots`, tools/screenshots/run.sh) is written for this version.
tests.screenshots = true
# Extra mods the harness can load: -Pcobblemon=true (Pokémon scenes), -Pmega=true (SCENE=battle).
tests.screenshot_cobblemon = ["maven.modrinth:cobblemon:kF7CvxTo", "maven.modrinth:cobbledollars:cqsHXSXe", "maven.modrinth:GebWh45l:Lecb595b", "maven.modrinth:8BmcQJ2H:dnJdtm0u", "maven.modrinth:dlx62Wp3:KQwSroDP"]
# Cobbleverse's performance stack, the pack's own versions (25.4): Sodium, Lithium, C2ME, FerriteCore, ModernFix,
# EntityCulling, ImmediatelyFast, Krypton, ScalableLux.
