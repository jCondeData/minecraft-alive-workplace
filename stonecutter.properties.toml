# -Pcreate=true (CREATE=true, a scene's create=True in tools/showcase/scenes.py): the owner's Create port too (M39).
tests.screenshot_create = ["libs/create-fabric-6.0.10.0+mc1.21.1.jar"]
tests.screenshot_waystones = ["maven.modrinth:waystones:Ub2AL65v", "maven.modrinth:MBAkmtvl:R6U3hZRZ"]
tests.screenshot_mega = ["maven.modrinth:SszvX85I:Y6di9Ram", "maven.modrinth:jtmvUHXj:Xlt4eWBe", "maven.modrinth:ccKDOlHs:JB1fLQnc", "maven.modrinth:lhGA9TYQ:Wto0RchG"]
